name: Build Rust Binary

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "要建置 binary 的 ref；未指定時使用觸發 workflow 的 ref"
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: "已上傳的 Rust binary artifact 名稱"
        value: ${{ jobs.build.outputs.artifact_name }}
      binary_filename:
        description: "release asset 使用的 binary 檔名"
        value: ${{ jobs.build.outputs.binary_filename }}
      binary_sha256:
        description: "binary SHA-256"
        value: ${{ jobs.build.outputs.binary_sha256 }}
      source_hash:
        description: "Rust production source hash"
        value: ${{ jobs.build.outputs.source_hash }}
      target:
        description: "Rust binary target triple"
        value: ${{ jobs.build.outputs.target }}
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      binary_filename: ${{ env.BINARY_FILENAME }}
      binary_sha256: ${{ steps.binary-sha.outputs.binary_sha256 }}
      source_hash: ${{ steps.source-hash.outputs.source_hash }}
      target: ${{ env.RUST_BINARY_TARGET }}
    env:
      BINARY_NAME: immich-geodata
      BINARY_PACKAGE_VERSION: v2
      RUST_BINARY_TARGET: x86_64-unknown-linux-gnu
      BINARY_FILENAME: immich-geodata-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Compute Rust source hash
        id: source-hash
        run: |
          source_hash="$(.github/scripts/compute-rust-source-hash.sh)"
          echo "source_hash=${source_hash}" >> "$GITHUB_OUTPUT"
          echo "Rust source hash: ${source_hash}"

      - name: Prepare package metadata
        id: package
        run: |
          artifact_name="${BINARY_FILENAME}-${BINARY_PACKAGE_VERSION}-${{ steps.source-hash.outputs.source_hash }}"
          cache_dir=".cache/rust-binary/${BINARY_PACKAGE_VERSION}/${{ steps.source-hash.outputs.source_hash }}"
          artifact_dir=".cache/rust-binary-artifact/${artifact_name}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=${artifact_dir}" >> "$GITHUB_OUTPUT"
          echo "cache_dir=${cache_dir}" >> "$GITHUB_OUTPUT"

      - name: Restore exact binary cache
        id: binary-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.package.outputs.cache_dir }}
          key: rust-binary-${{ runner.os }}-${{ env.RUST_BINARY_TARGET }}-${{ env.BINARY_PACKAGE_VERSION }}-${{ steps.source-hash.outputs.source_hash }}

      - name: Set up Rust
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install system dependencies
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libproj-dev pkg-config

      - name: Build Rust binary
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: cargo build --release

      - name: Package freshly built binary
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          cache_dir="${{ steps.package.outputs.cache_dir }}"
          mkdir -p "${cache_dir}"
          cp "target/release/${BINARY_NAME}" "${cache_dir}/${BINARY_FILENAME}"
          strip "${cache_dir}/${BINARY_FILENAME}"
          chmod +x "${cache_dir}/${BINARY_FILENAME}"
          ldd "${cache_dir}/${BINARY_FILENAME}" > "${cache_dir}/${BINARY_FILENAME}.ldd.txt"
          (
            cd "${cache_dir}"
            sha256sum "${BINARY_FILENAME}" > "${BINARY_FILENAME}.sha256"
            tar -czf "${BINARY_FILENAME}.tar.gz" "${BINARY_FILENAME}"
            sha256sum "${BINARY_FILENAME}.tar.gz" > "${BINARY_FILENAME}.tar.gz.sha256"
          )
          binary_sha256="$(cut -d ' ' -f1 "${cache_dir}/${BINARY_FILENAME}.sha256")"
          binary_tar_gz_sha256="$(cut -d ' ' -f1 "${cache_dir}/${BINARY_FILENAME}.tar.gz.sha256")"
          rustc_version="$(rustc -Vv | tr '\n' ';' | sed 's/;$/\n/')"
          cargo_version="$(cargo -V)"
          ldd_json="$(jq -Rs 'split("\n")[:-1]' < "${cache_dir}/${BINARY_FILENAME}.ldd.txt")"
          jq -n \
            --arg binary_name "${BINARY_NAME}" \
            --arg binary_filename "${BINARY_FILENAME}" \
            --arg binary_package_version "${BINARY_PACKAGE_VERSION}" \
            --arg binary_sha256 "${binary_sha256}" \
            --arg binary_tar_gz_filename "${BINARY_FILENAME}.tar.gz" \
            --arg binary_tar_gz_sha256 "${binary_tar_gz_sha256}" \
            --arg cargo_version "${cargo_version}" \
            --arg github_sha "${GITHUB_SHA}" \
            --arg rust_source_hash "${{ steps.source-hash.outputs.source_hash }}" \
            --arg rustc_version "${rustc_version}" \
            --arg target "${RUST_BINARY_TARGET}" \
            --argjson ldd "${ldd_json}" \
            '{
              binary_name: $binary_name,
              binary_filename: $binary_filename,
              binary_package_version: $binary_package_version,
              binary_sha256: $binary_sha256,
              binary_tar_gz_filename: $binary_tar_gz_filename,
              binary_tar_gz_sha256: $binary_tar_gz_sha256,
              cargo_version: $cargo_version,
              github_sha: $github_sha,
              ldd: $ldd,
              rust_source_hash: $rust_source_hash,
              rustc_version: $rustc_version,
              target: $target
            }' > "${cache_dir}/${BINARY_FILENAME}.manifest.json"

      - name: Validate cached binary package
        run: |
          cache_dir="${{ steps.package.outputs.cache_dir }}"
          test -x "${cache_dir}/${BINARY_FILENAME}"
          test -f "${cache_dir}/${BINARY_FILENAME}.sha256"
          test -f "${cache_dir}/${BINARY_FILENAME}.tar.gz"
          test -f "${cache_dir}/${BINARY_FILENAME}.tar.gz.sha256"
          test -f "${cache_dir}/${BINARY_FILENAME}.ldd.txt"
          test -f "${cache_dir}/${BINARY_FILENAME}.manifest.json"
          (
            cd "${cache_dir}"
            sha256sum -c "${BINARY_FILENAME}.sha256"
            sha256sum -c "${BINARY_FILENAME}.tar.gz.sha256"
          )

      - name: Capture binary SHA-256
        id: binary-sha
        run: |
          binary_sha256="$(cut -d ' ' -f1 "${{ steps.package.outputs.cache_dir }}/${BINARY_FILENAME}.sha256")"
          echo "binary_sha256=${binary_sha256}" >> "$GITHUB_OUTPUT"

      - name: Verify Rust release fixture smoke
        run: |
          "${{ steps.package.outputs.cache_dir }}/${BINARY_FILENAME}" help >/dev/null
          "${{ steps.package.outputs.cache_dir }}/${BINARY_FILENAME}" release \
            --fixture-mode \
            --pass-locationiq \
            --output-folder /tmp/rust-release-smoke

      - name: Save exact binary cache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.package.outputs.cache_dir }}
          key: rust-binary-${{ runner.os }}-${{ env.RUST_BINARY_TARGET }}-${{ env.BINARY_PACKAGE_VERSION }}-${{ steps.source-hash.outputs.source_hash }}

      - name: Prepare flat binary artifact
        run: |
          artifact_dir="${{ steps.package.outputs.artifact_dir }}"
          cache_dir="${{ steps.package.outputs.cache_dir }}"
          rm -rf "${artifact_dir}"
          mkdir -p "${artifact_dir}"
          cp "${cache_dir}/${BINARY_FILENAME}" "${artifact_dir}/"
          cp "${cache_dir}/${BINARY_FILENAME}.sha256" "${artifact_dir}/"
          cp "${cache_dir}/${BINARY_FILENAME}.tar.gz" "${artifact_dir}/"
          cp "${cache_dir}/${BINARY_FILENAME}.tar.gz.sha256" "${artifact_dir}/"
          cp "${cache_dir}/${BINARY_FILENAME}.ldd.txt" "${artifact_dir}/"
          cp "${cache_dir}/${BINARY_FILENAME}.manifest.json" "${artifact_dir}/"

      - name: Upload Rust binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_dir }}/*
          if-no-files-found: error
