name: PR Checks

# Reason: Enforce the conventions that CI can check but a checklist cannot.
# Runs on every pull request, unlike rust-ci.yaml which is path-filtered.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  title:
    name: PR title follows Conventional Commits
    # Reason: Label changes cannot affect the title, so skip those events.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # Reason: The title drives Release Drafter categorisation and the
      # generated release notes, so an invalid title silently degrades them.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the autolabeler patterns in release-drafter.yml.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false

  diff-guards:
    name: Diff guards
    runs-on: ubuntu-24.04
    steps:
      # Reason: pull_request checks out refs/pull/N/merge, whose first parent is
      # the base branch tip and whose tree already contains the merge result.
      # Diffing HEAD^1..HEAD therefore gives merge-base semantics without the
      # cost of a full clone; comparing base.sha to head.sha directly (two-dot)
      # would report unrelated changes that landed on main after the PR branched.
      - name: Checkout merge ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Reason: data/handler/*_geodata.csv is canonical production metadata, not a
      # build artifact. Changing it requires the data-update label so that the
      # change is a deliberate data refresh rather than an accidental rewrite.
      - name: Canonical geodata files are protected
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Reason: --name-only 不做 rename 偵測，純目錄搬移會被當成「新增 canonical
          # 檔案」而誤報。守衛要管的是內容有沒有變，不是路徑有沒有動，因此改以
          # --name-status -M 取狀態，並略過內容完全相同的 R100。帶修改的 rename
          # （R0xx）仍會被列出。
          changed="$(git diff --name-status -M HEAD^1 HEAD \
            | awk -F'\t' '$1 == "R100" { next } { print $NF }' \
            | grep -E '^data/handler/.*_geodata\.csv$' || true)"
          if [ -z "$changed" ]; then
            echo "No canonical geodata files changed."
            exit 0
          fi

          echo "Changed geodata files:"
          echo "$changed"

          if [[ ",$LABELS," == *",data-update,"* ]]; then
            echo "The data-update label is present; treating this as a deliberate data refresh."
            exit 0
          fi

          echo "::error::data/handler/*_geodata.csv changed without the 'data-update' label. Add the label if this is a deliberate data refresh, otherwise revert these files."
          exit 1

      # Reason: A missing link reference does not fail the release. The
      # extract-release-notes.sh script silently falls back to a git-derived
      # compare link, so the mistake only surfaces as a wrong link in the
      # published notes. CI is the only thing that catches it.
      - name: CHANGELOG link references are complete
        run: |
          fail=0
          versions="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | grep -v '^未發佈版本$')"
          while read -r v; do
            [ -n "$v" ] || continue
            grep -q "^\[${v}\]: " CHANGELOG.md \
              || { echo "::error::CHANGELOG.md is missing the link reference for [${v}]"; fail=1; }
          done <<< "$versions"

          latest="$(head -1 <<< "$versions")"
          grep -q "^\[未發佈版本\]: .*/compare/v${latest}\.\.\.HEAD$" CHANGELOG.md \
            || { echo "::error::[未發佈版本] should compare against v${latest}...HEAD"; fail=1; }

          [ "$fail" -eq 0 ] && echo "All CHANGELOG link references are present."
          exit "$fail"
