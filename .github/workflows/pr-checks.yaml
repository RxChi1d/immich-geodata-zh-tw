name: PR Checks

# Reason: Enforce the conventions that CI can check but a checklist cannot.
# Runs on every pull request, unlike rust-ci.yaml which is path-filtered.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  title:
    name: PR title follows Conventional Commits
    # Reason: Label changes cannot affect the title, so skip those events.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # Reason: The title drives Release Drafter categorisation and the
      # generated release notes, so an invalid title silently degrades them.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the autolabeler patterns in release-drafter.yml.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false

  diff-guards:
    name: Diff guards
    runs-on: ubuntu-24.04
    env:
      # Reason: \x{...} in grep -P is only reliable under a UTF-8 locale.
      LC_ALL: C.UTF-8
    steps:
      # Reason: pull_request checks out refs/pull/N/merge, whose first parent is
      # the base branch tip and whose tree already contains the merge result.
      # Diffing HEAD^1..HEAD therefore gives merge-base semantics without the
      # cost of a full clone; comparing base.sha to head.sha directly (two-dot)
      # would report unrelated changes that landed on main after the PR branched.
      - name: Checkout merge ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Reason: meta_data/*_geodata.csv is canonical production metadata, not a
      # build artifact. Changing it requires the data-update label so that the
      # change is a deliberate data refresh rather than an accidental rewrite.
      - name: Canonical geodata files are protected
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD -- 'meta_data/*_geodata.csv')"
          if [ -z "$changed" ]; then
            echo "No canonical geodata files changed."
            exit 0
          fi

          echo "Changed geodata files:"
          echo "$changed"

          if [[ ",$LABELS," == *",data-update,"* ]]; then
            echo "The data-update label is present; treating this as a deliberate data refresh."
            exit 0
          fi

          echo "::error::meta_data/*_geodata.csv changed without the 'data-update' label. Add the label if this is a deliberate data refresh, otherwise revert these files."
          exit 1

      # Reason: Code comments are being migrated to English. Warn instead of
      # failing while the existing Chinese comments are still being converted;
      # tighten this to an error once the migration is complete.
      - name: New code comments are in English
        if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
        run: |
          # Reason: git pathspec wildcards cross '/', so 'src/*.rs' already
          # covers nested files; 'src/**/*.rs' would skip the crate root.
          added="$(git diff -U0 HEAD^1 HEAD -- 'src/*.rs' 'tests/*.rs' \
            | grep -E '^\+' | grep -vE '^\+\+\+' || [ $? -eq 1 ])"

          offenders="$(printf '%s\n' "$added" \
            | grep -E '^\+.*(//|/\*)|^\+\s*\*' \
            | grep -P '[\x{4e00}-\x{9fff}\x{3000}-\x{303f}\x{ff00}-\x{ffef}]' || [ $? -eq 1 ])"

          if [ -z "$offenders" ]; then
            echo "No Chinese characters found in added code comments."
            exit 0
          fi

          echo "::warning::Added code comments contain Chinese characters. New comments should be written in English."
          printf '%s\n' "$offenders"
