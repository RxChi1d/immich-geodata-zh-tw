name: Auto Update

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: '只驗證 Rust binary artifact，不更新 nightly release'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "33 3 * * 5"

# Reason: 發布改為每次排程都執行後，排程、手動觸發與 re-run 可能重疊。
# 兩個 run 同時搬移 nightly tag 與更新同一個 release 會互相覆蓋，
# 因此序列化；發布途中不可取消，否則會留下只上傳一半 assets 的 release。
concurrency:
  group: auto-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rust-binary:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-rust-binary.yaml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true' && github.ref || 'main' }}

  auto-update:
    environment: Action Env
    needs: rust-binary
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true' && github.ref || 'main' }}
      - name: Download Rust binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rust-binary.outputs.artifact_name }}
          path: .rust-binary
      - name: Verify Rust binary artifact
        run: |
          binary=".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}"
          expected_source_hash="${{ needs.rust-binary.outputs.source_hash }}"
          actual_source_hash="$(.github/scripts/compute-rust-source-hash.sh)"
          if [[ "${actual_source_hash}" != "${expected_source_hash}" ]]; then
            echo "Rust source hash 不符合 binary manifest"
            echo "expected=${expected_source_hash}"
            echo "actual=${actual_source_hash}"
            exit 1
          fi
          chmod +x "${binary}"
          (
            cd .rust-binary
            sha256sum -c "${{ needs.rust-binary.outputs.binary_filename }}.sha256"
            sha256sum -c "${{ needs.rust-binary.outputs.binary_filename }}.tar.gz.sha256"
          )
          actual_binary_sha="$(cut -d ' ' -f1 ".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.sha256")"
          if [[ "${actual_binary_sha}" != "${{ needs.rust-binary.outputs.binary_sha256 }}" ]]; then
            echo "Rust binary SHA-256 不符合 workflow output"
            exit 1
          fi
          "${binary}" help >/dev/null
          "${binary}" release \
            --fixture-mode \
            --pass-locationiq \
            --output-folder /tmp/rust-release-smoke
      - name: Set current date as env variable
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Build with Rust
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: |
          # TW/JP/KR/TH/ID 皆由 handler 消耗 data/handler/*_geodata.csv，
          # 不需再以 --country-code 走 LocationIQ 流程；無 non-handler 國家時
          # locationiq 階段會自動 skip，因此也不需要 LOCATIONIQ_API_KEY。
          ".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}" release
      - name: Point nightly tag at built commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        # Reason: nightly release 改為就地更新（allowUpdates），而 ncipollo 只在
        # 建立時使用 commit 參數，既有 tag 不會被移動。若不主動搬移，nightly tag
        # 會永遠停在第一次建立時的 commit，與 artifacts 不同源。
        run: |
          git tag -f nightly
          git push --force origin refs/tags/nightly
      - name: Create Release
        # Reason: 每次排程都重新發布 nightly。上游 GeoNames 由 prepare 於執行時
        # 重新下載、產物含當日 geodata-date.txt，兩者都不在 git 追蹤範圍內，
        # 因此「git 有無變更」無法代表產物有無變更。先前以 auto-commit 的
        # changes_detected 當發布條件，在所有國家改為 handler、圖資中繼目錄
        # 不再變動後恆為 false，nightly 自 2026-05-29 起停止發布。
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        uses: ncipollo/release-action@v1
        with:
          name: Automated Nightly Build ${{ env.TODAY }}
          # Reason: 僅上傳對使用者有意義的 assets；未壓縮 binary、
          # ldd.txt 與 manifest.json 為 CI 工程用途（workflow 間以
          # artifacts 傳遞），不需出現在 release 頁面。
          artifacts: |
            output/release.*
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.tar.gz
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.tar.gz.sha256
          # Reason: 預設只在 glob 無匹配或 asset 上傳失敗時發出 warning，
          # 會發出缺少檔案的 release。nightly 缺 release.tar.gz 會讓
          # update_data.sh 下載失敗，必須讓 workflow 直接失敗。
          artifactErrorsFailBuild: true
          body: |
            這是自動發布的 nightly 版本，包含最新的地理資料，未經正式版本的完整驗證。
            需要穩定版本請選擇標示 "Latest" 的 [release](https://github.com/RxChi1d/immich-geodata-zh-tw/releases/latest)。

            若 Immich 沒有套用新資料，請將 `geodata/geodata-date.txt` 的內容改成與目前不同的值後重啟。
            遇到問題歡迎回報 [issue](https://github.com/RxChi1d/immich-geodata-zh-tw/issues)。
          draft: false
          generateReleaseNotes: false
          # Reason: 就地更新既有 release，不先刪除。update_data.sh 會先以
          # releases/tags/nightly 驗證 tag，404 即中止安裝；delete→create
          # 之間有數十秒的上傳空窗，且 create 失敗時 nightly 會整週消失。
          allowUpdates: true
          tag: nightly
          makeLatest: false
          prerelease: true
