name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '請輸入語意化版本標籤 (例如: v1.0.0)'
        required: true
        type: string
      validate_only:
        description: '只驗證 Rust binary artifact，不建立 release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*' # 語意化版本標籤，例如 v1.0.0、v1.0.0a1

defaults:
  run:
    shell: bash

jobs:
  rust-binary:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-rust-binary.yaml

  release:
    environment: Action Env
    needs: rust-binary
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    env:
      # 手動觸發時使用輸入值，否則使用推送的 tag 名稱
      VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}
    steps:
      - name: 驗證版本標籤 (PEP 440)
        run: |
          echo "驗證 VERSION_TAG: ${VERSION_TAG}"
          # 允許格式：vMAJOR.MINOR.PATCH 或 vMAJOR.MINOR.PATCHaN/bN/rcN（PEP 440 預發布版本）
          REGEX='^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'
          if [[ ! "$VERSION_TAG" =~ $REGEX ]]; then
            echo "❌ 無效的 VERSION_TAG: $VERSION_TAG"
            echo "預期格式 (PEP 440): vMAJOR.MINOR.PATCH 或 vMAJOR.MINOR.PATCHaN/bN/rcN"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download Rust binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rust-binary.outputs.artifact_name }}
          path: .rust-binary
      - name: Verify Rust binary artifact
        run: |
          binary=".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}"
          expected_source_hash="${{ needs.rust-binary.outputs.source_hash }}"
          actual_source_hash="$(.github/scripts/compute-rust-source-hash.sh)"
          if [[ "${actual_source_hash}" != "${expected_source_hash}" ]]; then
            echo "Rust source hash 不符合 binary manifest"
            echo "expected=${expected_source_hash}"
            echo "actual=${actual_source_hash}"
            exit 1
          fi
          chmod +x "${binary}"
          (
            cd .rust-binary
            sha256sum -c "${{ needs.rust-binary.outputs.binary_filename }}.sha256"
            sha256sum -c "${{ needs.rust-binary.outputs.binary_filename }}.tar.gz.sha256"
          )
          actual_binary_sha="$(cut -d ' ' -f1 ".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.sha256")"
          if [[ "${actual_binary_sha}" != "${{ needs.rust-binary.outputs.binary_sha256 }}" ]]; then
            echo "Rust binary SHA-256 不符合 workflow output"
            exit 1
          fi
          "${binary}" help >/dev/null
          "${binary}" release \
            --fixture-mode \
            --pass-locationiq \
            --output-folder /tmp/rust-release-smoke
      - name: Verify handler geodata exists
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: |
          # handler 國家的納入依賴 data/handler/*_geodata.csv 存在；
          # 缺檔會讓該國「靜默」消失於 release，因此先硬性驗證。
          missing=0
          for country in tw jp kr th id; do
            if [[ ! -s "data/handler/${country}_geodata.csv" ]]; then
              echo "::error::data/handler/${country}_geodata.csv 缺失或為空，該國將從 release 消失"
              missing=1
            fi
          done
          exit "${missing}"
      - name: Set current date as env variable
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Build with Rust
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        env:
          # Reason: environment: Action Env 只讓 secret 可被引用，不會自動變成環境
          # 變數；locationiq 階段讀 LOCATIONIQ_API_KEY，缺這段會在啟動時就失敗。
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        run: |
          # TW/JP/KR/TH/ID 由 handler 消耗 data/handler/*_geodata.csv，不走
          # LocationIQ；MY 為 non-handler 國家，以 data/locationiq/MY.csv 續跑，
          # 每次只補查 cities500 新增的座標。
          ".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}" release \
            --country-code MY
      - name: Generate release notes from CHANGELOG
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: |
          # Changelog-first：release notes 由 CHANGELOG.md 對應版本區段生成
          # （正式版缺區段會在此失敗，提醒先完成 CHANGELOG 版本切割；
          # 預發布版缺區段則輸出簡化說明）。
          .github/scripts/extract-release-notes.sh "${VERSION_TAG}" CHANGELOG.md \
            > /tmp/release_notes.md
          echo "--- release notes 預覽 ---"
          cat /tmp/release_notes.md
      - name: Create Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION_TAG }}
          # Reason: 僅上傳對使用者有意義的 assets；未壓縮 binary、
          # ldd.txt 與 manifest.json 為 CI 工程用途（workflow 間以
          # artifacts 傳遞），不需出現在 release 頁面。
          artifacts: |
            output/release.*
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.tar.gz
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.tar.gz.sha256
            LICENSE
            update_data.sh
          draft: false
          generateReleaseNotes: false
          commit: main
          tag: ${{ env.VERSION_TAG }}
          # Release notes 來源為 CHANGELOG.md 對應版本區段（changelog-first，
          # 見上方 Generate release notes 步驟）；Release Drafter 草稿僅為
          # 撰寫 CHANGELOG 時的參考清單，不會被發佈。
          bodyFile: /tmp/release_notes.md
          # 與 Release Drafter 草稿共存的保險：若草稿恰與本次 tag 同名，
          # allowUpdates 讓發布接管該草稿（轉正並以 bodyFile 內容覆寫），
          # 避免 tag 已有 release 的 422 衝突；一般情況草稿 tag 不同名，
          # 照常建立新 release，草稿於下次 push main 時自動重算。
          allowUpdates: true
          # 僅穩定版本標記為 latest；含預發布標識（a/b/rc/alpha/beta）的標記為 prerelease
          makeLatest: ${{ !contains(env.VERSION_TAG, 'a') && !contains(env.VERSION_TAG, 'b') && !contains(env.VERSION_TAG, 'rc') && !contains(env.VERSION_TAG, 'alpha') && !contains(env.VERSION_TAG, 'beta') }}
          prerelease: ${{ contains(env.VERSION_TAG, 'a') || contains(env.VERSION_TAG, 'b') || contains(env.VERSION_TAG, 'rc') || contains(env.VERSION_TAG, 'alpha') || contains(env.VERSION_TAG, 'beta') }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        id: auto-commit
        with:
          # Reason: 分支名必須逐次唯一。日期分支在同日的第二次執行會撞上既有遠端
          # 分支：一般 push 以 non-fast-forward 失敗，force push 則會沖掉前一個
          # 未合併 PR 裡的 LocationIQ 查詢結果（那是付費查詢，重跑要再花額度）。
          # 兩次執行的座標集合也不保證是包含關係——release 由 tag 觸發，checkout
          # 的是該 tag 而非 main，上游 GeoNames 也可能在兩次下載之間變動。
          # run_attempt 一併納入：re-run 會沿用同一個 run_id。
          branch: chore/update-meta-data-${{ env.TODAY }}-${{ github.run_id }}-${{ github.run_attempt }}
          create_branch: true
          commit_message: Auto update reverse geocoding data on ${{ env.TODAY }}
          # Reason: data/locationiq/* 是 LocationIQ 逐點付費查詢的結果，重跑會再次
          # 消耗額度；寫回 git 是它跨次執行存活的唯一方式。2026-09-01 收窄
          # file_pattern 時被一併移除，此處復原。
          file_pattern: data/handler/* data/locationiq/*
      - name: Create PR for geodata updates
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/update-meta-data-${{ env.TODAY }}-${{ github.run_id }}-${{ github.run_attempt }}"
          existing=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(geodata): 發布後更新圖資 ${{ env.TODAY }}" \
              --body "這是 release 流程產生的圖資更新（handler 圖資與 LocationIQ 查詢結果），請審核後合併。"
          else
            echo "已有開啟中的 PR，跳過建立。"
          fi
