name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '請輸入語意化版本標籤 (例如: v1.0.0)'
        required: true
        type: string
      validate_only:
        description: '只驗證 Rust binary artifact，不建立 release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*' # 語意化版本標籤，例如 v1.0.0、v1.0.0a1

defaults:
  run:
    shell: bash

jobs:
  rust-binary:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-rust-binary.yaml

  release:
    environment: Action Env
    needs: rust-binary
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    env:
      # 手動觸發時使用輸入值，否則使用推送的 tag 名稱
      VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}
    steps:
      - name: 驗證版本標籤 (PEP 440)
        run: |
          echo "驗證 VERSION_TAG: ${VERSION_TAG}"
          # 允許格式：vMAJOR.MINOR.PATCH 或 vMAJOR.MINOR.PATCHaN/bN/rcN（PEP 440 預發布版本）
          REGEX='^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'
          if [[ ! "$VERSION_TAG" =~ $REGEX ]]; then
            echo "❌ 無效的 VERSION_TAG: $VERSION_TAG"
            echo "預期格式 (PEP 440): vMAJOR.MINOR.PATCH 或 vMAJOR.MINOR.PATCHaN/bN/rcN"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download Rust binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rust-binary.outputs.artifact_name }}
          path: .rust-binary
      - name: Verify Rust binary artifact
        run: |
          binary=".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}"
          expected_source_hash="${{ needs.rust-binary.outputs.source_hash }}"
          actual_source_hash="$(.github/scripts/compute-rust-source-hash.sh)"
          if [[ "${actual_source_hash}" != "${expected_source_hash}" ]]; then
            echo "Rust source hash 不符合 binary manifest"
            echo "expected=${expected_source_hash}"
            echo "actual=${actual_source_hash}"
            exit 1
          fi
          chmod +x "${binary}"
          (
            cd .rust-binary
            sha256sum -c "${{ needs.rust-binary.outputs.binary_filename }}.sha256"
            sha256sum -c "${{ needs.rust-binary.outputs.binary_filename }}.tar.gz.sha256"
          )
          actual_binary_sha="$(cut -d ' ' -f1 ".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.sha256")"
          if [[ "${actual_binary_sha}" != "${{ needs.rust-binary.outputs.binary_sha256 }}" ]]; then
            echo "Rust binary SHA-256 不符合 workflow output"
            exit 1
          fi
          "${binary}" help >/dev/null
          "${binary}" release \
            --fixture-mode \
            --pass-locationiq \
            --output-folder /tmp/rust-release-smoke
      - name: Verify handler geodata exists
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: |
          # handler 國家的納入依賴 meta_data/*_geodata.csv 存在；
          # 缺檔會讓該國「靜默」消失於 release，因此先硬性驗證。
          missing=0
          for country in tw jp kr th; do
            if [[ ! -s "meta_data/${country}_geodata.csv" ]]; then
              echo "::error::meta_data/${country}_geodata.csv 缺失或為空，該國將從 release 消失"
              missing=1
            fi
          done
          exit "${missing}"
      - name: Set current date as env variable
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Build with Rust
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        run: |
          # TH 已改由 handler 處理（消耗 meta_data/th_geodata.csv），
          # 不需再以 --country-code 走 LocationIQ 流程；
          # 無 non-handler 國家時 locationiq 階段會自動 skip。
          ".rust-binary/${{ needs.rust-binary.outputs.binary_filename }}" release \
            --locationiq-api-key "${{ secrets.LOCATIONIQ_API_KEY }}"
      - name: Create Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION_TAG }}
          artifacts: |
            output/release.*
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.sha256
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.tar.gz
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.tar.gz.sha256
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.ldd.txt
            .rust-binary/${{ needs.rust-binary.outputs.binary_filename }}.manifest.json
            LICENSE
            update_data.sh
          draft: false
          generateReleaseNotes: false
          commit: main
          tag: ${{ env.VERSION_TAG }}
          # Release Drafter 草稿接管：
          #   release-drafter 每次 push main 會以同名 tag（vX.Y.Z）維護一份
          #   草稿 release。啟用 allowUpdates 讓正式發布接管既有草稿並轉正
          #   （上方 draft: false 在更新時生效），artifacts 附加至同一 release。
          #   omitBodyDuringUpdate 保留草稿中已手動改寫的 release notes，
          #   避免被空 body 覆寫。無同名草稿時照常建立新 release。
          allowUpdates: true
          omitBodyDuringUpdate: true
          # 僅穩定版本標記為 latest；含預發布標識（a/b/rc/alpha/beta）的標記為 prerelease
          makeLatest: ${{ !contains(env.VERSION_TAG, 'a') && !contains(env.VERSION_TAG, 'b') && !contains(env.VERSION_TAG, 'rc') && !contains(env.VERSION_TAG, 'alpha') && !contains(env.VERSION_TAG, 'beta') }}
          prerelease: ${{ contains(env.VERSION_TAG, 'a') || contains(env.VERSION_TAG, 'b') || contains(env.VERSION_TAG, 'rc') || contains(env.VERSION_TAG, 'alpha') || contains(env.VERSION_TAG, 'beta') }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.validate_only == 'true') }}
        id: auto-commit
        with:
          branch: chore/update-meta-data-${{ env.TODAY }}
          create_branch: true
          commit_message: Auto update reverse geocoding data on ${{ env.TODAY }}
          file_pattern: meta_data/*
      - name: Create PR for meta_data
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/update-meta-data-${{ env.TODAY }}"
          existing=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(geodata): 發布後更新 meta_data ${{ env.TODAY }}" \
              --body "這是 release 流程產生的 meta_data 更新，請審核後合併。"
          else
            echo "已有開啟中的 PR，跳過建立。"
          fi
