<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" aria-label="立方體與圓盤的差異：切向 20×20 公里的點距離 28.3 公里仍在盒內，軸向 25.5 公里的點在盒外" >
  <defs>
